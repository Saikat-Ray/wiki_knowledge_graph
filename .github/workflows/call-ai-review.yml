name: Call AI Review

on:
  issue_comment:
    types: [created]
  workflow_dispatch:  # for manual testing

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  call-ai-review:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/review'))
    uses: Saikat-Ray/genai_code_reviewer/.github/workflows/reusable-review.yml@main
    with:
      pr_number: ${{ github.event.issue.number }}
      trigger_comment: ${{ github.event.comment.body }}
      trigger_user: ${{ github.event.comment.user.login }}
    secrets:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}